name: VS Code Extension

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-host:
    name: ${{ matrix.name }} extension host
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            compiler: sagan
            server: sagan-lsp
          - name: macOS
            runner: macos-latest
            compiler: sagan
            server: sagan-lsp
          - name: Windows
            runner: windows-latest
            compiler: sagan.exe
            server: sagan-lsp.exe
    env:
      SAGAN_COMPILER_PATH: ${{ github.workspace }}/sagan-source/bin/${{ matrix.compiler }}
      SAGAN_LSP_PATH: ${{ github.workspace }}/sagan-source/bin/${{ matrix.server }}
    steps:
      - name: Check out extension
        uses: actions/checkout@v7
        with:
          path: extension
          persist-credentials: false
      - name: Resolve pinned compiler source
        id: source
        shell: bash
        working-directory: extension
        run: |
          sha="$(tr -d '\r\n' < sagan-source-commit.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Sagan compiler source
        uses: actions/checkout@v7
        with:
          repository: Sagan-Shoulak/sagan
          ref: ${{ steps.source.outputs.sha }}
          path: sagan-source
          persist-credentials: false
      - name: Verify compiler source pin
        shell: bash
        working-directory: sagan-source
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install virtual display support
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Set up MSYS2 UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gcc
      - name: Build compiler and language server on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: sagan-source
        run: make all bin/sagan-lsp
      - name: Build compiler and language server on macOS
        if: runner.os == 'macOS'
        working-directory: sagan-source
        run: make CXX=clang++ all bin/sagan-lsp
      - name: Build compiler and language server on Linux
        if: runner.os == 'Linux'
        working-directory: sagan-source
        run: make all bin/sagan-lsp
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Run extension unit tests
        working-directory: extension
        run: npm test
      - name: Verify extension bundle
        working-directory: extension
        run: npm run test:bundle
      - name: Run Extension Development Host integration
        if: runner.os != 'Linux'
        working-directory: extension
        run: npm run test:integration
      - name: Run Extension Development Host integration on Linux
        if: runner.os == 'Linux'
        working-directory: extension
        run: xvfb-run --auto-servernum npm run test:integration
